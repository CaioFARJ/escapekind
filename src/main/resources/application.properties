spring.application.name=escapekind

server.port=8080

# Base de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/escapekind
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Credenciais do administrador (configuráveis aqui; em produção usar variáveis de ambiente)
app.admin.username=admin
app.admin.password=escapekind2026
