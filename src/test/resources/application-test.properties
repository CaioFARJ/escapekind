# Perfil de teste: substitui PostgreSQL por base de dados H2 em memória
# Evita dependência de infraestrutura local durante os testes

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desativa inicialização do admin em testes para evitar erros de config
app.admin.username=testadmin
app.admin.password=testpassword
